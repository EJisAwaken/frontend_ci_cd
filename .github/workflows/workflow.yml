name: Test CI/CD Workflow
on:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v4

      - name: installer nodejs
        uses: actions/setup-node@v4
        with:
            node-version: '22'
            cache: 'npm'

      - name: build frontend
        run: |
            npm ci
            npm run build
            

  buildfrontend:
    runs-on: ubuntu-latest
    steps:
      - name : recuper le code source
        uses: actions/checkout@v4
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
            context: ./
            file: ./Dockerfile
            push: false
            tags: nantenaina/frontend:latest
