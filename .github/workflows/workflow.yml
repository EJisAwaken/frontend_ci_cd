name: Test CI/CD Workflow
on:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  runs-on: ubuntu-latest
  steps:
    - name: Recuperer le code source
    - uses: actions/checkout@v4

    - name: installer nodejs
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: build frontend
    - run: |
        cd frontend
        npm ci
        npm run build
